name: CI

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

jobs:
  android-ci:
    name: Android Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: ../scripts/get-version.sh --github-env

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Run Android Unit Tests (Host JVM)
        run: ./gradlew testDebugUnitTest

      - name: Run Android Instrumented Tests (Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: Android
          script: ./gradlew connectedDebugAndroidTest

      - name: Keep Android Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-${{ steps.version.outputs.version_name }}
          path: |
            Android/app/build/reports/tests/
            Android/app/build/reports/androidTests/
            Android/app/build/test-results/

      - name: Keep Android Build Products
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ steps.version.outputs.version_name }}
          path: Android/app/build/outputs/apk/debug/*.apk

  ios-ci:
    name: iOS Build & Test
    runs-on: macos-15
    defaults:
      run:
        working-directory: iOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: ../scripts/get-version.sh --github-env

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Start CoreSimulator & Find Simulator Device
        id: sim
        run: |
          # Wake up CoreSimulator daemon
          xcrun simctl list devices > /dev/null 2>&1 || true

          # Find first available iPhone simulator device UDID
          DEVICE_ID=$(xcrun simctl list devices available | grep -E 'iPhone' | grep -v 'unavailable' | head -n 1 | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/' || true)

          if [ -z "$DEVICE_ID" ]; then
            # Fallback to any available simulator device
            DEVICE_ID=$(xcrun simctl list devices available | grep -E '\([0-9A-F-]{36}\)' | head -n 1 | sed -E 's/.*\(([-0-9A-F]+)\).*/\1/' || true)
          fi

          echo "Resolved Simulator Device UDID: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> $GITHUB_OUTPUT

      - name: Build iOS App for Simulator
        run: |
          xcodebuild build \
            -project MonsterCards.xcodeproj \
            -scheme MonsterCards \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.version.outputs.version_name }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run iOS Unit Tests (MonsterCardsTests)
        run: |
          DESTINATION="platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}"
          if [ -z "${{ steps.sim.outputs.device_id }}" ]; then DESTINATION="platform=iOS Simulator,name=iPhone 16"; fi
          xcodebuild test \
            -project MonsterCards.xcodeproj \
            -scheme MonsterCards \
            -destination "$DESTINATION" \
            -only-testing:MonsterCardsTests \
            -resultBundlePath TestResults-Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run iOS UI Tests (MonsterCardsUITests)
        run: |
          DESTINATION="platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}"
          if [ -z "${{ steps.sim.outputs.device_id }}" ]; then DESTINATION="platform=iOS Simulator,name=iPhone 16"; fi
          xcodebuild test \
            -project MonsterCards.xcodeproj \
            -scheme MonsterCards \
            -destination "$DESTINATION" \
            -only-testing:MonsterCardsUITests \
            -resultBundlePath TestResults-UI.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Keep iOS Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-${{ steps.version.outputs.version_name }}
          path: |
            iOS/TestResults-Unit.xcresult
            iOS/TestResults-UI.xcresult

      - name: Keep iOS Build Products
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app-${{ steps.version.outputs.version_name }}
          path: iOS/build/Build/Products/Debug-iphonesimulator/*.app
