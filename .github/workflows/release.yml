name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Validate Tag & Prepare Release Branch
    runs-on: ubuntu-latest
    outputs:
      tag_commit: ${{ steps.validate.outputs.tag_commit }}
      tag_name: ${{ steps.validate.outputs.tag_name }}
      release_branch: ${{ steps.validate.outputs.release_branch }}
      version_name: ${{ steps.validate.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate Tag, Develop, Main, and Create Release Branch
        id: validate
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "Target tag: $TAG"

          # Fetch remote branches and tags
          git fetch origin develop:develop main:main --tags

          # 1. Verify tag exists
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag '$TAG' does not exist in the repository."
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          echo "Tag '$TAG' points to commit: $TAG_COMMIT"

          # 2. Verify tag commit is in develop branch
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/develop; then
            echo "::error::Tag '$TAG' (commit $TAG_COMMIT) is not in the develop branch."
            exit 1
          fi
          echo "Confirmed: Tag '$TAG' is in develop branch."

          # 3. Verify tag commit is in main, or fast-forward merge it to main
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Confirmed: Tag '$TAG' is already in main branch."
          else
            echo "Tag '$TAG' is not in main. Attempting fast-forward only merge..."
            git checkout main
            if ! git merge --ff-only "$TAG_COMMIT"; then
              echo "::error::Tag '$TAG' cannot be fast-forward merged into main."
              exit 1
            fi
            git push origin main
            echo "Successfully fast-forward merged '$TAG' into main."
          fi

          # 4. Create and push the release/v* branch from the tag commit
          RELEASE_BRANCH="release/${TAG}"
          echo "Creating release branch '$RELEASE_BRANCH' from commit $TAG_COMMIT..."
          git checkout -B "$RELEASE_BRANCH" "$TAG_COMMIT"
          git push -u origin "$RELEASE_BRANCH" --force

          VERSION_NAME="${TAG#v}"

          echo "tag_commit=$TAG_COMMIT" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "release_branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

  android-release:
    name: Android Release Build & Test
    needs: prepare-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_commit }}

      - name: Validate Android Signing Credentials
        id: check_credentials
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::warning::Android release signing credentials were not provided. Release build was not built."
            echo "::error::Missing Android signing secrets. Please configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Android Release (APK & AAB)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/Android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.prepare-release.outputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Run Android Unit Tests (Host JVM)
        run: ./gradlew testReleaseUnitTest

      - name: Run Android Instrumented Tests (Emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: Android
          script: ./gradlew connectedReleaseAndroidTest

      - name: Keep Android Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-test-results
          path: |
            Android/app/build/reports/tests/
            Android/app/build/reports/androidTests/
            Android/app/build/test-results/

      - name: Keep Android Release Products
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts-${{ needs.prepare-release.outputs.tag_name }}
          path: |
            Android/app/build/outputs/apk/release/*.apk
            Android/app/build/outputs/bundle/release/*.aab

  ios-release:
    name: iOS Release Build & Test
    needs: prepare-release
    runs-on: macos-15
    defaults:
      run:
        working-directory: iOS

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_commit }}

      - name: Validate iOS Signing Credentials
        id: check_credentials
        run: |
          if [ -z "${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}" ] || \
             [ -z "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" ] || \
             [ -z "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ]; then
            echo "::warning::iOS release signing credentials were not provided. Release build was not built."
            echo "::error::Missing iOS signing secrets. Please configure IOS_SIGNING_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, and IOS_PROVISIONING_PROFILE_BASE64."
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Set up Keychain and Provisioning Profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision

      - name: Run iOS Unit Tests (Simulator)
        run: |
          xcodebuild test \
            -project MonsterCards.xcodeproj \
            -scheme MonsterCards \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:MonsterCardsTests \
            -resultBundlePath TestResults-Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS UI Tests (Simulator)
        run: |
          xcodebuild test \
            -project MonsterCards.xcodeproj \
            -scheme MonsterCards \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:MonsterCardsUITests \
            -resultBundlePath TestResults-UI.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive iOS App
        run: |
          xcodebuild archive \
            -project MonsterCards.xcodeproj \
            -scheme MonsterCards \
            -configuration Release \
            -archivePath $RUNNER_TEMP/MonsterCards.xcarchive \
            MARKETING_VERSION=${{ needs.prepare-release.outputs.version_name }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Keep iOS Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-test-results
          path: |
            iOS/TestResults-Unit.xcresult
            iOS/TestResults-UI.xcresult

      - name: Keep iOS Release Products
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-archive-${{ needs.prepare-release.outputs.tag_name }}
          path: |
            ${{ runner.temp }}/MonsterCards.xcarchive
